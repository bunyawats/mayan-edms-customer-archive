services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mayan
      POSTGRES_USER: mayan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --databases 3
    volumes:
      - redis_data:/data

  app:
    image: mayanedms/mayanedms:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MAYAN_DATABASES: "{'default':{'ENGINE':'django.db.backends.postgresql','NAME':'mayan','USER':'mayan','PASSWORD':'${POSTGRES_PASSWORD}','HOST':'db'}}"
      MAYAN_CELERY_BROKER_URL: "redis://redis:6379/0"
      MAYAN_CELERY_RESULT_BACKEND: "redis://redis:6379/1"
      MAYAN_LOCK_MANAGER_BACKEND: "mayan.apps.lock_manager.backends.redis_lock.RedisLock"
      MAYAN_LOCK_MANAGER_BACKEND_ARGUMENTS: "{'redis_url':'redis://redis:6379/2'}"
      MAYAN_AUTOADMIN_USERNAME: ${MAYAN_AUTOADMIN_USERNAME}
      MAYAN_AUTOADMIN_PASSWORD: ${MAYAN_AUTOADMIN_PASSWORD}
    volumes:
      - app_data:/var/lib/mayan
    depends_on:
      - db
      - redis

  webapp:
    build: ./webapp
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MAYAN_URL: http://app:8000
      MAYAN_USER: ${MAYAN_AUTOADMIN_USERNAME}
      MAYAN_PASSWORD: ${MAYAN_AUTOADMIN_PASSWORD}
    depends_on:
      - app

volumes:
  postgres_data:
  redis_data:
  app_data:
