<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Archive</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand">Customer Archive</a>
  </header>
  <main class="container">
    {{ content | safe }}
  </main>
  <script>
    // Delegated on document.body (never replaced by an htmx swap) so this
    // keeps working across every re-render of #results — no per-render
    // rebinding needed.
    //
    // Selection itself is authoritative server-side (selection_store.py,
    // keyed by session cookie) precisely because it has to survive
    // Prev/Next and search destroying and rebuilding this fragment — see
    // docs/webapp-implementation-plan.md's "Cross-page bulk selection".
    // Each checkbox persists its own change via hx-post to
    // /documents/select (hx-swap="none" — the checkbox is already visually
    // correct the instant it's clicked) and that response OOB-refreshes
    // #bulk-toolbar (count + button) from the server-known total. The JS
    // below does *not* touch the count or the button — only two purely
    // client-side conveniences that don't need a round trip: select-all
    // instantly toggling this page's visible checkboxes (its own hx-post
    // still persists the real change), and keeping the header checkbox's
    // own tri-state (checked/indeterminate) in sync with this page's rows.
    document.body.addEventListener("change", function (e) {
      if (e.target.matches(".select-all")) {
        document.querySelectorAll('#results input[name="document_id"]').forEach(function (cb) {
          cb.checked = e.target.checked;
        });
      } else if (e.target.matches('input[name="document_id"]')) {
        updateSelectAllState();
      }
    });

    function updateSelectAllState() {
      var boxes = document.querySelectorAll('#results input[name="document_id"]');
      var checked = document.querySelectorAll('#results input[name="document_id"]:checked');
      var selectAll = document.querySelector("#results .select-all");
      if (!selectAll) return;
      selectAll.checked = boxes.length > 0 && checked.length === boxes.length;
      selectAll.indeterminate = checked.length > 0 && checked.length < boxes.length;
    }
  </script>
</body>
</html>
