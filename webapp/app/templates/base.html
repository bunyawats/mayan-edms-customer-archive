<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Archive</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand">Customer Archive</a>
  </header>
  <main class="container">
    {{ content | safe }}
  </main>
  <script>
    // Delegated on document.body (never replaced by an htmx swap) so this
    // keeps working across every re-render of #results — no per-render
    // rebinding needed. Selection itself is plain client-side DOM state
    // (see CLAUDE.md's webapp section for why that's an intentional POC
    // simplification, not an oversight): nothing here polls or swaps the
    // table out from under the user, so there's no server-side selection
    // store to keep in sync.
    document.body.addEventListener("change", function (e) {
      if (e.target.matches(".select-all")) {
        document.querySelectorAll('#results input[name="document_id"]').forEach(function (cb) {
          cb.checked = e.target.checked;
        });
        updateBulkToolbar();
      } else if (e.target.matches('input[name="document_id"]')) {
        updateBulkToolbar();
      }
    });

    function updateBulkToolbar() {
      var boxes = document.querySelectorAll('#results input[name="document_id"]');
      var checked = document.querySelectorAll('#results input[name="document_id"]:checked');
      var countEl = document.getElementById("selected-count");
      var btn = document.getElementById("bulk-delete-btn");
      var selectAll = document.querySelector("#results .select-all");
      if (countEl) countEl.textContent = checked.length + " selected";
      if (btn) btn.disabled = checked.length === 0;
      if (selectAll) {
        selectAll.checked = boxes.length > 0 && checked.length === boxes.length;
        selectAll.indeterminate = checked.length > 0 && checked.length < boxes.length;
      }
    }
  </script>
</body>
</html>
