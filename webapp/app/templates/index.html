<section class="toolbar">
  <h1>Customer Archive</h1>
  <button hx-get="/documents/new" hx-target="#modal" hx-swap="innerHTML">+ New document</button>
</section>

<form id="search-form" class="search-form" hx-get="/documents" hx-target="#results" hx-swap="innerHTML"
      hx-indicator="#search-indicator">
  <input name="customer_id" placeholder="Customer ID" value="{{ filters.customer_id or '' }}">
  <input name="account_id" placeholder="Account ID" value="{{ filters.account_id or '' }}">
  <input name="application_id" placeholder="Application ID" value="{{ filters.application_id or '' }}">
  <input name="category" placeholder="Category" value="{{ filters.category or '' }}">
  <input name="label" placeholder="Filename contains" value="{{ filters.label or '' }}">
  <button type="submit">Search</button>
  <span id="search-indicator" class="htmx-indicator">Searching…</span>
</form>

<div id="modal"></div>

<div id="results">
  {% include "partials/results_table.html" %}
</div>
