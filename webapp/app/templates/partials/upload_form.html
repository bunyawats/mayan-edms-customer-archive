<div class="modal-box">
  <h2>New document</h2>
  <form hx-post="/documents" hx-target="#modal" hx-swap="innerHTML" hx-encoding="multipart/form-data"
        hx-indicator="#upload-indicator">
    <label>Customer ID (required)
      <input name="customer_id" required>
    </label>
    <label>Account ID <small>(leave blank for a customer-level document)</small>
      <input name="account_id">
    </label>
    <label>Application ID <small>(requires Account ID; leave blank for account-level)</small>
      <input name="application_id">
    </label>
    <label>Category (required)
      <select name="category" id="category-select" required>
        <option value="" disabled selected>Select category&hellip;</option>
        {% for option in category_options %}
        <option value="{{ option }}">{{ option }}</option>
        {% endfor %}
        <option value="__new__">+ Add new category&hellip;</option>
      </select>
      <input type="text" name="category_new" id="category-new" placeholder="New category name"
             style="display:none" required>
    </label>
    <label>File (required)
      <input type="file" name="file" required>
    </label>
    <div class="modal-actions">
      <button type="submit">Upload</button>
      <button type="button" onclick="document.getElementById('modal').innerHTML=''">Cancel</button>
      <span id="upload-indicator" class="htmx-indicator">Uploading…</span>
    </div>
  </form>
</div>
