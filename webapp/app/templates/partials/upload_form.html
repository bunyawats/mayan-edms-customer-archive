<div class="modal-box">
  <h2>New document</h2>
  <form hx-post="/documents" hx-target="#modal" hx-swap="innerHTML" hx-encoding="multipart/form-data"
        hx-indicator="#upload-indicator">
    <label>Customer ID (required)
      <input name="customer_id" required>
    </label>
    <label>Account ID <small>(leave blank for a customer-level document)</small>
      <input name="account_id">
    </label>
    <label>Application ID <small>(requires Account ID; leave blank for account-level)</small>
      <input name="application_id">
    </label>
    <label>Category (required) <small>e.g. Photo ID, Welcome Letter, Financial Records, Agreements</small>
      <input name="category" required>
    </label>
    <label>File (required)
      <input type="file" name="file" required>
    </label>
    <div class="modal-actions">
      <button type="submit">Upload</button>
      <button type="button" onclick="document.getElementById('modal').innerHTML=''">Cancel</button>
      <span id="upload-indicator" class="htmx-indicator">Uploading…</span>
    </div>
  </form>
</div>
